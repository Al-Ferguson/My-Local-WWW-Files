[project]
name = "public_html"
version = "0.1.0"
description = "Add your description here"
license = "GPL-3.0-or-later"
requires-python = ">=3.14"
readme = "README.md"
readme-type = "markdown"
authors = [
    { name = "Al Ferguson", email = "aferguson@neptunescove.org" }
]
classifiers  = [
    # How mature is this project? Common values are
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable    
    "Development Status :: 4 - Beta",
    "Intended Audience :: Personal Use",
    "Programming Language :: PHP :: >=8.5",
    "Programming Language :: Python :: >=3.14",
]
dependencies = [
    "httpx >= 0.28.1",
    "icalendar >= 7.3.0",
    "types-icalendar >= 6.3.2",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.urls]
url = "https://github.com/AlFerguson/My-Local-WWW-Files"
url_type = "github"
documentation = "https://docs.github.com/AlFerguson/My-Local-WWW-Files"

[tool.uv]
upgrade = true

[tool.mypy]
allow_redefinition = false
check_untyped_defs = true
ignore_errors = false
ignore_missing_imports = true
local_partial_types = true
no_implicit_optional = true
python_version = 3.14
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100
target-version = "py314"

[dependency-groups]
dev = [
    "annotated-types>=0.8.0",
    "mypy>=1.7.1",
    "mypy-extensions>=1.0.0",
    "ruff>=0.15.17.0",
    "semgrep>=1.167.0.0",
    "typing_extensions>=4.7.1",
]
